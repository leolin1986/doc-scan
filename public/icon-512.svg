<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="doc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F3F4F6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Document shadow -->
  <rect x="126" y="82" width="270" height="350" rx="16" fill="#1E3A8A" opacity="0.25"/>

  <!-- Document body -->
  <rect x="120" y="76" width="270" height="350" rx="16" fill="url(#doc)"/>

  <!-- Document corner fold -->
  <path d="M 338 76 L 390 128 L 338 128 Z" fill="#DBEAFE"/>
  <path d="M 338 76 L 390 128 L 390 76 Z" fill="#BFDBFE"/>

  <!-- Text lines -->
  <rect x="156" y="160" width="160" height="10" rx="5" fill="#93C5FD"/>
  <rect x="156" y="186" width="200" height="10" rx="5" fill="#93C5FD"/>
  <rect x="156" y="212" width="140" height="10" rx="5" fill="#93C5FD"/>
  <rect x="156" y="238" width="180" height="10" rx="5" fill="#93C5FD"/>

  <!-- Scan line -->
  <rect x="120" y="280" width="270" height="4" rx="2" fill="#3B82F6" opacity="0.7"/>

  <!-- Corner detection dots -->
  <circle cx="120" cy="76" r="14" fill="#10B981"/>
  <circle cx="390" cy="76" r="14" fill="#F59E0B"/>
  <circle cx="390" cy="426" r="14" fill="#EF4444"/>
  <circle cx="120" cy="426" r="14" fill="#8B5CF6"/>

  <!-- Scan arrow -->
  <path d="M 256 330 L 256 380 M 240 364 L 256 380 L 272 364" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
